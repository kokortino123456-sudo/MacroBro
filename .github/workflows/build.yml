name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MacroBro.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacroBro-apk
          path: MacroBro.apk

      - name: Publish release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MacroBro build ${{ github.run_number }}
          body: Download MacroBro.apk below and open it on your phone to install or update.
          files: MacroBro.apk
          make_latest: true
